# Version catalog: one place for every dependency version.
# Build files refer to these as libs.<name> / libs.plugins.<name>.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
serialization = "1.11.0"
opencvDesktop = "4.9.0-0"   # org.openpnp: OpenCV Java API + natives for Win/Linux/macOS
opencvAndroid = "4.12.0"    # official OpenCV Android AAR (same Java API)
onnxruntime = "1.30.0"
junit = "6.1.3"
composeBom = "2026.09.00"
activityCompose = "1.13.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
opencv-desktop = { module = "org.openpnp:opencv", version.ref = "opencvDesktop" }
opencv-android = { module = "org.opencv:opencv", version.ref = "opencvAndroid" }
onnxruntime-desktop = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
