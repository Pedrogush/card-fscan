[project]
name = "card-fscan-tools"
version = "0.1.0"
description = "Shared test tooling for card-fscan: name index builder, synthetic photo generator, eval"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy==2.5.3",
    "opencv-contrib-python-headless==5.0.0.93",
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
    "pillow==12.3.0",
]

[dependency-groups]
dev = ["pymupdf==1.28.2"]

[tool.uv]
package = false
